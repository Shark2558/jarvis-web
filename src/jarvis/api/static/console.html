<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --line:#1e2a37; --text:#dbe4ee; --muted:#7f93a8;
    --accent:#4cc9f0; --accent-2:#1f8fb3; --warn:#f6b73c; --danger:#ef5b5b; --ok:#3ecf8e;
    --radius:12px; --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9ff,var(--accent) 45%,var(--accent-2) 75%);box-shadow:0 0 14px var(--accent)}
  .orb.busy{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px var(--accent)}50%{box-shadow:0 0 22px var(--accent)}}
  header h1{font-size:15px;letter-spacing:.14em;font-weight:600;margin:0}
  header .spacer{flex:1}
  header .who{color:var(--muted);font-size:13px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#16202b;color:var(--text);padding:7px 12px}
  button:hover{border-color:var(--accent-2)}
  button.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  button.approve{background:#174d38;border-color:#1f6b4c}
  button.decline{background:#4d1a1a;border-color:#6b2222}
  button:disabled{opacity:.5;cursor:default}
  main{display:grid;grid-template-columns:1fr 340px;height:calc(100% - 53px)}
  @media (max-width:860px){main{grid-template-columns:1fr}aside{display:none}}
  #chat{display:flex;flex-direction:column;min-width:0}
  #log{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78ch;padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:#1b2a3a}
  .msg.jarvis{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.sys{align-self:center;color:var(--muted);font-size:13px;background:none}
  .meta{color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono)}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e141b;color:var(--text);font:inherit}
  textarea:focus{outline:none;border-color:var(--accent-2)}
  aside{border-left:1px solid var(--line);background:#0d131a;overflow:auto;padding:14px}
  aside h2{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:14px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
  .card.pending{border-color:var(--warn)}
  .card .tool{font-family:var(--mono);color:var(--accent)}
  .card .args{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap;margin:6px 0}
  .card .row{display:flex;gap:8px;margin-top:8px}
  .audit{font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line)}
  .audit .ok{color:var(--ok)} .audit .warn{color:var(--warn)} .audit .bad{color:var(--danger)}
  .empty{color:var(--muted);font-size:13px}
  #gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.92)}
  #gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(420px,92vw);text-align:center}
  #gate input{width:100%;margin:12px 0;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0e141b;color:var(--text);font:inherit}
  .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 0}
  .stat b{color:var(--text);font-weight:500;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <div class="orb" id="orb"></div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button id="newBtn" title="Start a fresh conversation">New session</button>
  <button id="logoutBtn" style="display:none">Sign out</button>
</header>

<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Ask JARVIS… (Enter to send, Shift+Enter for a new line)" autocomplete="off"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
  <aside>
    <h2>Awaiting your approval</h2>
    <div id="approvals"><div class="empty">Nothing pending.</div></div>
    <h2>Session</h2>
    <div class="card">
      <div class="stat"><span>Model</span><b id="sModel">—</b></div>
      <div class="stat"><span>Turns</span><b id="sTurns">0</b></div>
      <div class="stat"><span>Cost (USD)</span><b id="sCost">0.0000</b></div>
      <div class="stat"><span>Last latency</span><b id="sLat">—</b></div>
    </div>
    <h2>Activity log <span id="auditOk"></span></h2>
    <div id="audit"><div class="empty">No tool activity yet.</div></div>
  </aside>
</main>

<div id="gate"><div class="box" id="gateBox"></div></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state = { sessionId: null, authMode: 'token', token: sessionStorage.getItem('jarvis_token') || '', honorific: 'Sir' };

  // ---- transport: cookie + anti-CSRF header, or bearer token for token mode ---------------
  async function api(path, opts = {}) {
    const headers = Object.assign({ 'X-Requested-With': 'JARVIS' }, opts.headers || {});
    if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
    if (state.authMode === 'token' && state.token) headers['Authorization'] = 'Bearer ' + state.token;
    const r = await fetch(path, { method: opts.method || (opts.body !== undefined ? 'POST' : 'GET'),
      headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
    if (r.status === 401) { showGate(); throw new Error('sign in required'); }
    if (!r.ok) {
      let detail = r.statusText;
      try { const j = await r.json(); detail = j.detail || j.error || detail; } catch (_) {}
      throw new Error(detail);
    }
    return r.status === 204 ? null : r.json();
  }

  // ---- sign-in gate ----------------------------------------------------------------------
  function showGate() {
    const box = $('gateBox');
    if (state.authMode === 'google') {
      box.innerHTML = '<h2 style="margin:0 0 6px">Private system</h2><p style="color:var(--muted)">Sign in with the Google account registered as owner.</p>' +
        '<button class="primary" id="gBtn">Sign in with Google</button>';
      $('gBtn').onclick = () => { location.href = '/auth/login'; };
    } else {
      box.innerHTML = '<h2 style="margin:0 0 6px">Access token</h2><p style="color:var(--muted)">Paste the JARVIS_API_TOKEN for this server.</p>' +
        '<input id="tokIn" type="password" placeholder="token"><button class="primary" id="tokBtn">Continue</button>';
      $('tokBtn').onclick = () => { state.token = $('tokIn').value.trim(); sessionStorage.setItem('jarvis_token', state.token); hideGate(); refreshSide(); };
    }
    $('gate').style.display = 'flex';
  }
  function hideGate() { $('gate').style.display = 'none'; }

  // ---- rendering -------------------------------------------------------------------------
  function addMsg(role, text, meta) {
    const d = document.createElement('div'); d.className = 'msg ' + role;
    d.textContent = text;
    if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
    $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  }
  function renderApprovals(list) {
    const el = $('approvals');
    if (!list.length) { el.innerHTML = '<div class="empty">Nothing pending.</div>'; return; }
    el.innerHTML = list.map(a => `
      <div class="card pending" data-id="${esc(a.id)}">
        <div><span class="tool">${esc(a.tool)}</span> · <span style="color:var(--warn)">${esc(a.risk)}</span></div>
        <div>${esc(a.summary)}</div>
        <div class="args">${esc(JSON.stringify(a.arguments, null, 1))}</div>
        <div class="row"><button class="approve">Approve</button><button class="decline">Decline</button></div>
      </div>`).join('');
    el.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      card.querySelector('.approve').onclick = () => decide(id, 'approve');
      card.querySelector('.decline').onclick = () => decide(id, 'decline');
    });
  }
  function renderAudit(data) {
    $('auditOk').textContent = data.verified ? '· chain verified' : '· CHAIN BROKEN';
    $('auditOk').style.color = data.verified ? 'var(--ok)' : 'var(--danger)';
    const el = $('audit'); const entries = data.entries.slice(-40).reverse();
    if (!entries.length) { el.innerHTML = '<div class="empty">No tool activity yet.</div>'; return; }
    const cls = o => o === 'executed' ? 'ok' : (o === 'awaiting_confirmation' ? 'warn' : (o === 'denied' || o === 'declined' || o === 'error' ? 'bad' : ''));
    el.innerHTML = entries.map(e => `<div class="audit">${esc(String(e.at || '').slice(11,19))} <span class="${cls(e.outcome)}">${esc(e.outcome)}</span> ${esc(e.tool)}</div>`).join('');
  }
  function renderStats(r) {
    $('sModel').textContent = r.model || '—'; $('sTurns').textContent = r.turn_count ?? '—';
    $('sCost').textContent = (r.cost_usd ?? 0).toFixed(4); $('sLat').textContent = r.latency_ms != null ? r.latency_ms + ' ms' : '—';
  }
  async function refreshSide() {
    try { renderApprovals(await api('/v1/approvals')); renderAudit(await api('/v1/audit?limit=100')); } catch (_) {}
  }

  // ---- actions ---------------------------------------------------------------------------
  function busy(on) { $('orb').classList.toggle('busy', on); $('send').disabled = on; }
  function handleResponse(r) {
    state.sessionId = r.session_id;
    addMsg('jarvis', r.reply, `${r.model} · ${r.latency_ms} ms · $${r.cost_usd.toFixed(4)}` + (r.tool_calls ? ` · ${r.tool_calls} tool call(s)` : ''));
    renderStats(r); refreshSide();
  }
  async function send(text) {
    addMsg('user', text); busy(true);
    try { handleResponse(await api('/v1/chat', { body: { message: text, session_id: state.sessionId } })); }
    catch (e) { addMsg('sys', 'JARVIS could not answer: ' + e.message); }
    finally { busy(false); }
  }
  async function decide(id, action) {
    if (!state.sessionId) { addMsg('sys', 'No active session for this approval.'); return; }
    busy(true);
    try { handleResponse(await api(`/v1/approvals/${encodeURIComponent(id)}/${action}`, { body: { session_id: state.sessionId } })); }
    catch (e) { addMsg('sys', `Could not ${action}: ` + e.message); refreshSide(); }
    finally { busy(false); }
  }

  $('form').addEventListener('submit', (ev) => {
    ev.preventDefault(); const t = $('input').value.trim(); if (!t) return; $('input').value = ''; send(t);
  });
  $('input').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('form').requestSubmit(); } });
  $('newBtn').onclick = () => { state.sessionId = null; $('log').innerHTML = ''; addMsg('sys', 'New session.'); };
  $('logoutBtn').onclick = async () => { try { await api('/auth/logout', { body: {} }); } catch (_) {} location.reload(); };

  // ---- boot ------------------------------------------------------------------------------
  (async () => {
    try { const c = await (await fetch('/console/config')).json(); state.authMode = c.auth_mode; state.honorific = c.honorific || 'Sir'; } catch (_) {}
    if (state.authMode === 'google') {
      const r = await fetch('/auth/me', { credentials: 'same-origin' });
      if (r.status !== 200) { showGate(); return; }
      const me = await r.json(); $('who').textContent = me.email; $('logoutBtn').style.display = '';
    }
    addMsg('sys', `Online. Good ${new Date().getHours() < 12 ? 'morning' : (new Date().getHours() < 18 ? 'afternoon' : 'evening')}, ${state.honorific}.`);
    refreshSide();
  })();
})();
</script>
</body>
</html>
