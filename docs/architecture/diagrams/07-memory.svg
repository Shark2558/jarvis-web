      <text x="60" y="51" class="markdy-svg-mono" font-size="9.5" font-weight="500" fill="#475569" dominant-baseline="central">only your own lines count</text>
    </g>
    <g id="node-Panel" transform="translate(48, 272)" >
      <rect width="296" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="295" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#f59e0b" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5" />
        <path d="M3 9h18" />
        <path d="M7 7h.01M10 7h.01" />
