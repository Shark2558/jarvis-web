      <rect x="54" y="43" width="173.20000000000002" height="16" rx="4" fill="#0f1c2e" fill-opacity="0.05" stroke="#cbd5e1" stroke-width="0.75"/>
      <text x="60" y="51" class="markdy-svg-mono" font-size="9.5" font-weight="500" fill="#475569" dominant-baseline="central">no cards, IDs or passwords</text>
    </g>
    <g id="node-Store" transform="translate(1320, 264)" >
