<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --line:#1e2a37; --text:#dbe4ee; --muted:#7f93a8;
    --accent:#4cc9f0; --accent-2:#1f8fb3; --warn:#f6b73c; --danger:#ef5b5b; --ok:#3ecf8e;
    --radius:12px; --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9ff,var(--accent) 45%,var(--accent-2) 75%);box-shadow:0 0 14px var(--accent)}
  .orb.busy{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px var(--accent)}50%{box-shadow:0 0 22px var(--accent)}}
  header h1{font-size:15px;letter-spacing:.14em;font-weight:600;margin:0}
  header .spacer{flex:1}
  header .who{color:var(--muted);font-size:13px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#16202b;color:var(--text);padding:7px 12px}
  button:hover{border-color:var(--accent-2)}
  button.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  button.approve{background:#174d38;border-color:#1f6b4c}
  button.decline{background:#4d1a1a;border-color:#6b2222}
  button:disabled{opacity:.5;cursor:default}
  main{display:grid;grid-template-columns:1fr 340px;height:calc(100% - 53px)}
  @media (max-width:860px){main{grid-template-columns:1fr}aside{display:none}}
  #chat{display:flex;flex-direction:column;min-width:0}
  #log{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78ch;padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:#1b2a3a}
  .msg.jarvis{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.sys{align-self:center;color:var(--muted);font-size:13px;background:none}
  .meta{color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono)}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e141b;color:var(--text);font:inherit}
  textarea:focus{outline:none;border-color:var(--accent-2)}
  aside{border-left:1px solid var(--line);background:#0d131a;overflow:auto;padding:14px}
  aside h2{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:14px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
  .card.pending{border-color:var(--warn)}
  .card .tool{font-family:var(--mono);color:var(--accent)}
  .card .args{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap;margin:6px 0}
  .card .row{display:flex;gap:8px;margin-top:8px}
  .audit{font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line)}
  .audit .ok{color:var(--ok)} .audit .warn{color:var(--warn)} .audit .bad{color:var(--danger)}
  .empty{color:var(--muted);font-size:13px}
  #gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.92)}
  #gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(420px,92vw);text-align:center}
  #gate input{width:100%;margin:12px 0;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0e141b;color:var(--text);font:inherit}
  .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 0}
  .stat b{color:var(--text);font-weight:500;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <div class="orb" id="orb"></div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button id="newBtn" title="Start a fresh conversation">New session</button>
  <button id="logoutBtn" style="display:none">Sign out</button>
</header>

<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Ask JARVIS… (Enter to send, Shift+Enter for a new line)" autocomplete="off"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
  <aside>
    <h2>Awaiting your approval</h2>
    <div id="approvals"><div class="empty">Nothing pending.</div></div>
    <h2>Session</h2>
    <div class="card">
      <div class="stat"><span>Model</span><b id="sModel">—</b></div>
      <div class="stat"><span>Turns</span><b id="sTurns">0</b></div>
      <div class="stat"><span>Cost (USD)</span><b id="sCost">0.0000</b></div>
      <div class="stat"><span>Last latency</span><b id="sLat">—</b></div>
    </div>
    <h2>Activity log <span id="auditOk"></span></h2>
    <div id="audit"><div class="empty">No tool activity yet.</div></div>
  </aside>
</main>

<div id="gate"><div class="box" id="gateBox"></div></div>

<script src="/static/console.js" defer></script>
</body>
</html>
