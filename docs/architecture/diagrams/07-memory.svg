      <rect x="320.6" y="427" width="138.8" height="18" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="390" y="436" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">what matters here?</text>
    </g>
    <g id="edge-flow_6" class="markdy-edge" >
      <path d="M 800 398 L 812 398 Q 818 398 818 392 L 818 392 Q 818 386 824 386 L 1288 386 Q 1302 386 1302 372 L 1302 317 Q 1302 308 1311 308 L 1320 308" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="1036" y="377" width="48" height="18" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="1060" y="386" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">read</text>
    </g>
  </g>
  <!-- Node Cards -->
  <g class="markdy-nodes-layer">
    <g id="node-Turn" transform="translate(48, 92)" >
      <rect width="256" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="255" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
