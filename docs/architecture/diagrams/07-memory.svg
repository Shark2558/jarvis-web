      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#38bdf8" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4.5" width="16" height="6.5" rx="2" />
        <rect x="4" y="13" width="16" height="6.5" rx="2" />
        <path d="M7.5 7.75h.01M7.5 16.25h.01" />
        <path d="M11 7.75h6M11 16.25h6" />
