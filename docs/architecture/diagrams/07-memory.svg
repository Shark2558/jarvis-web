      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Your next turn</text>
    </g>
    <g id="node-Extract" transform="translate(472, 180)" >
      <rect width="256" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="255" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#60a5fa" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 16a4 4 0 0 1-.88-7.9 5 5 0 0 1 9.76-1.1A4 4 0 0 1 17 16H7z" />
      </g>
      <!-- Label -->
      <text x="54" y="31" class="markdy-svg-text" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Private brain</text>
      <!-- Tech Badge -->
      <rect x="54" y="43" width="167" height="16" rx="4" fill="#0f1c2e" fill-opacity="0.05" stroke="#cbd5e1" stroke-width="0.75"/>
      <text x="60" y="51" class="markdy-svg-mono" font-size="9.5" font-weight="500" fill="#475569" dominant-baseline="central">pulls out facts, no tools</text>
    </g>
    <g id="node-Recall" transform="translate(472, 360)" >
      <rect width="328" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="327" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
