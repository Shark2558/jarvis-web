[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
dynamic = ["version"]  # R6.1 D4: read from src/jarvis/__init__.py (the one version source)
description = "J.A.R.V.I.S. — personal AI assistant. Phase 0: core reasoning loop with session memory."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "anthropic>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "google-cloud-firestore>=2.19,<3",
    "cryptography>=42",
    "joserfc>=1.0",  # BSD-3-Clause: VAPID JWT (R3 D11); already locked via authlib
    "webauthn>=3.0.1,<4",  # py_webauthn (Duo Labs, BSD-3-Clause): passkeys for R3 approvals
    # slice 10 E: text from attached documents (no OCR). pypdf BSD-3-Clause (6.x: decompression
    # and loop limits); python-docx MIT (lxml parser with resolve_entities=False).
    "pypdf>=6.21,<7",
    "python-docx>=1.2,<2",
    # slice 12 code review CR-7: IANA zone data for zoneinfo (the quota ledger's Pacific time)
    # even in an image without /usr/share/zoneinfo. Apache-2.0.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6",
    "shellcheck-py>=0.10",
]
# R3: the home bridge on the owner's laptop (deploy/home/bridge.Dockerfile), never the cloud
# image: Frigate's events over MQTT. aiomqtt BSD-3-Clause (paho-mqtt EPL-2.0 OR BSD-3-Clause).
# Pinned to the versions hash-locked in deploy/home/bridge-requirements.txt (integrated review C1).
homebridge = ["aiomqtt==2.5.1", "paho-mqtt==2.1.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.dynamic]
# R6.1 D4 (review L2): the number lives only in `jarvis.__version__`; setuptools reads it
# statically (no import), so a version bump is one line in one file.
version = { attr = "jarvis.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# R6.1 D4: the build time the Dockerfile stamps before `pip install .` (git-ignored; absent in a
# plain checkout, where the Vitals "About JARVIS" line says "unknown")
"jarvis" = ["BUILD_DATE"]
"jarvis.api" = [
    "static/*.html",
    "static/*.js",
    "static/*.css",
    "static/fonts/*.woff2",
    "static/fonts/*.txt",
    "static/vendor/*.js",
    "static/vendor/*.txt",
    "static/vendor/ort/*.mjs",
    "static/vendor/ort/*.wasm",
    "static/vendor/ort/*.txt",
    "static/wakeword/*.onnx",
    "static/wakeword/*.txt",
]
# R3 C: the laptop Faces page the bridge serves on 127.0.0.1:8098
"jarvis.homebridge" = ["static/faces.html", "static/faces.js", "static/faces.css"]
# R6 D4: the build book CI writes before `docker build` (git-ignored; absent in a plain checkout)
"jarvis.buildbook" = ["_book/*"]
# R6 D3, D5: the generator's hashed name list and known fakes (the deploy job installs non-editable)
"jarvis.buildbook.gen" = ["redact.json", "fake_secrets.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "firestore_emulator: runs against the Firestore emulator (needs FIRESTORE_EMULATOR_HOST)",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
