# android/gradle/wrapper/gradle-wrapper.properties -- R7 D23: Gradle 9.6.0, the minimum and the default for
# the Android Gradle plugin 9.5 (developer.android.com, read 13 Nov 2026). The wrapper scripts and jar come
# from Gradle's own GitHub tag v9.6.0; CI's wrapper validation checks the jar. distributionSha256Sum is NOT
# pinned yet: services.gradle.org is refused from the workspace that wrote this, so CI's "wrapper-pin" job
# prints the official sum and fails until Part E writes it here (docs/plans/r7-integration/I0-NOTES.md).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
