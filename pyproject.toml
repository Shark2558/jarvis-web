[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "J.A.R.V.I.S. — personal AI assistant. Phase 0: core reasoning loop with session memory."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "anthropic>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "google-cloud-firestore>=2.19,<3",
    "cryptography>=42",
    "webauthn>=3.0.1,<4",  # py_webauthn (Duo Labs, BSD-3-Clause): passkeys for R3 approvals
    # slice 10 E: text from attached documents (no OCR). pypdf BSD-3-Clause (6.x: decompression
    # and loop limits); python-docx MIT (lxml parser with resolve_entities=False).
    "pypdf>=6.21,<7",
    "python-docx>=1.2,<2",
    # slice 12 code review CR-7: IANA zone data for zoneinfo (the quota ledger's Pacific time)
    # even in an image without /usr/share/zoneinfo. Apache-2.0.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6",
    "shellcheck-py>=0.10",
]
# R3: the home bridge on the owner's laptop (deploy/home/bridge.Dockerfile), never the cloud
# image: Frigate's events over MQTT. aiomqtt BSD-3-Clause (paho-mqtt EPL-2.0 / EDL-1.0).
homebridge = ["aiomqtt>=2.3,<3"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.api" = [
    "static/*.html",
    "static/*.js",
    "static/*.css",
    "static/fonts/*.woff2",
    "static/fonts/*.txt",
    "static/vendor/*.js",
    "static/vendor/*.txt",
    "static/vendor/ort/*.mjs",
    "static/vendor/ort/*.wasm",
    "static/vendor/ort/*.txt",
    "static/wakeword/*.onnx",
    "static/wakeword/*.txt",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "firestore_emulator: runs against the Firestore emulator (needs FIRESTORE_EMULATOR_HOST)",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
