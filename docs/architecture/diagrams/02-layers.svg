<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 896 1120" width="896" height="1120">
  <defs>
    <!-- Embedded Typography & Anti-Aliasing -->
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!-- Drop Shadow Filter -->
    <filter id="markdy-node-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#020617" flood-opacity="0.08"/>
    </filter>

    <!-- Grid Patterns -->
    <pattern id="markdy-grid-minor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="markdy-grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1.2" stroke-opacity="0.6"/>
    </pattern>

    <!-- Arrowhead Markers -->
    <marker id="arrow-request" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4 L 3.4 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
    </marker>
  </defs>

