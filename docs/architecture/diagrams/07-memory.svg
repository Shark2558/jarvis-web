<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1584 576" width="1584" height="576">
  <defs>
    <!-- Embedded Typography & Anti-Aliasing -->
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!-- Drop Shadow Filter -->
    <filter id="markdy-node-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#020617" flood-opacity="0.08"/>
    </filter>

    <!-- Grid Patterns -->
    <pattern id="markdy-grid-minor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="markdy-grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1.2" stroke-opacity="0.6"/>
    </pattern>

    <!-- Arrowhead Markers -->
    <marker id="arrow-request" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4 L 3.4 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <rect width="100%" height="100%" fill="url(#markdy-grid-minor)"/>
  <rect width="100%" height="100%" fill="url(#markdy-grid-major)"/>
  

  <!-- Diagram Title -->
  <g class="markdy-title-layer">
    <text x="48" y="44" class="markdy-svg-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f1c2e" dominant-baseline="central" letter-spacing="-0.02em">Figure 7 · How JARVIS remembers you</text>
  </g>
  <!-- Main Scene Content -->
  <g class="markdy-camera-layer">
  <!-- Edge Connections -->
  <g class="markdy-edges-layer">
    <g id="edge-flow_1" class="markdy-edge" >
      <path d="M 304 142 L 366 142 Q 380 142 380 156 L 380 192 Q 380 206 394 206 L 472 206" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"  marker-end="url(#arrow-event)"/>
      <!-- Edge Label -->
      <rect x="360.4" y="183.5" width="99.19999999999999" height="45" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="410" y="193" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">after the</text>
      <text x="410" y="206" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">reply; daily</text>
      <text x="410" y="219" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">sweep</text>
    </g>
    <g id="edge-flow_2" class="markdy-edge" >
      <path d="M 606 256 L 1046 256 Q 1054 256 1054 264 L 1054 272" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="754" y="247" width="152" height="18" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="830" y="256" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">new or changed facts</text>
    </g>
    <g id="edge-flow_3" class="markdy-edge" >
      <path d="M 1192 310 L 1247 310 Q 1248 310 1248 309 L 1248 309 Q 1248 308 1249 308 L 1320 308" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="1225" y="292" width="86" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="1268" y="301.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">kept, no</text>
      <text x="1268" y="314.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">duplicates</text>
    </g>
    <g id="edge-flow_4" class="markdy-edge" >
      <path d="M 344 296 L 928 296" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="533.6" y="287" width="204.79999999999998" height="18" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="636" y="296" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">your own additions and edits</text>
    </g>
    <g id="edge-flow_5" class="markdy-edge" >
      <path d="M 150 452 L 150 444 Q 150 436 158 436 L 630 436" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
